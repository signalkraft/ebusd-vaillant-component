[project]
site_url = "https://signalkraft.com/ebusd-vaillant-component/"
site_name = "ebusd Vaillant Component for Home Assistant"
site_description = "Home Assistant custom component for Vaillant heating devices over ebusd MQTT"
repo_url = "https://github.com/signalkraft/ebusd-vaillant-component"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
    { "Setup" = [
        "index.md",
        "ebusd.md",
    ] },
    { "Component" = [
        "entities.md",
        "options.md",
        "services.md",
    ] },
    { "Contributing" = [
        "development.md",
        "data-capture.md",
        "mapping.md",
    ] },
]

[project.extra]
generator = false

[project.theme]
logo = "assets/logo.png"
features = [
    "navigation.instant",
    "navigation.sections",
    "navigation.tracking",
    "content.action.edit", # Edit this page
    "content.action.view", # View source of this page
    "content.code.annotate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
