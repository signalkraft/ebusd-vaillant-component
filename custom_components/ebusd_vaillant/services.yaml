dump_mqtt_values:
  name: Dump MQTT values
  description: >
    Returns all ebusd MQTT values accumulated since startup as a YAML dict,
    keyed by device. Also creates a persistent notification with the output.

record_topic_changes:
  name: Record topic changes
  description: >
    Subscribes to the configured ebusd MQTT prefix for a configurable duration
    and returns all received messages as a list of {ts, topic, value} entries.
  fields:
    timeout:
      name: Timeout
      description: How many seconds to listen before returning (1-3600, default 10).
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
