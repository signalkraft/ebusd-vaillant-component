<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1000 650"
   width="100%"
   height="100%"
   style="background-color: #f7f9fc; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;"
   version="1.1"
   id="svg33"
   sodipodi:docname="ebus-hardware.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview33"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.2368929"
     inkscape:cx="557.04094"
     inkscape:cy="359.36821"
     inkscape:window-width="2560"
     inkscape:window-height="1355"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg33" />
  <defs
     id="defs2">
    <!-- Drop shadows for physical devices to make them pop -->
    <filter
       id="shadow"
       x="-0.00625"
       y="-0.01"
       width="1.0125"
       height="1.02">
      <feDropShadow
         dx="3"
         dy="5"
         stdDeviation="6"
         flood-opacity="0.15" />
    </filter>
    <filter
       id="heavy-shadow"
       x="-0.0013888889"
       y="-0.002"
       width="1.0027778"
       height="1.004">
      <feDropShadow
         dx="5"
         dy="10"
         stdDeviation="8"
         flood-opacity="0.2" />
    </filter>
    <!-- Linear gradient for cables -->
    <linearGradient
       id="usbCable"
       x1="35.132403"
       y1="1697.5782"
       x2="55.626304"
       y2="1697.5782"
       gradientTransform="matrix(6.8477705,0,0,0.29277002,-190.91617,0)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#333"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#444"
         id="stop2" />
    </linearGradient>
    <!-- Arrow head for label -->
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="5"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#eab308"
         id="path2" />
    </marker>
  </defs>
  <!-- Title / Legend -->
  <!-- ========================================== -->
  <!--               BACKGROUND WIRES             -->
  <!-- ========================================== -->
  <g
     id="wires"
     fill="none"
     stroke-linejoin="round">
    <!-- USB-C Power Wire (to eAS stick) -->
    <!-- Straight horizontal line -->
    <path
       d="M 49.662465,500 H 190"
       stroke="url(#usbCable)"
       stroke-width="8.4955"
       id="path3"
       style="stroke:url(#usbCable)" />
    <!-- eBUS Connection Wire -->
    <!-- Straight line from eAS Stick, extending right to gateway and down to existing bus -->
    <!-- Background flat color layer -->
    <path
       d="M 395 500 L 625 500 L 625 400 M 510 500 L 510 590"
       stroke="#f0b27a"
       stroke-width="8"
       id="path4" />
    <!-- Foreground dashed wire effect -->
    <path
       d="M 395 500 L 625 500 L 625 400 M 510 500 L 510 590"
       stroke="#d35400"
       stroke-width="4"
       stroke-dasharray="8 4"
       id="path5" />
    <!-- eBUS continuation dashes to the bottom -->
    <path
       d="M 510 595 L 510 645"
       stroke="#d35400"
       stroke-width="6"
       stroke-linecap="round"
       stroke-dasharray="8 8"
       id="path6" />
    <!-- Gateway Power Wire -->
    <!-- Straight vertical line from Gateway down to the power block -->
    <path
       d="M 700,400 V 580.63581"
       stroke="#222222"
       stroke-width="5"
       id="path7"
       sodipodi:nodetypes="cc" />
    <!-- Gateway Ethernet Wire -->
    <!-- Vertical drop, right turn, vertical drop to router -->
    <path
       d="M 780,400 V 578.0377"
       stroke="#3498db"
       stroke-width="6"
       id="path8"
       sodipodi:nodetypes="cc" />
  </g>
  <!-- Electrical T-Junction Node for eBUS network -->
  <circle
     cx="510"
     cy="500"
     r="6"
     fill="#d35400"
     id="circle8" />
  <!-- Text indicating the rest of the existing layout -->
  <text
     x="525"
     y="630"
     font-size="14"
     fill="#b45309"
     font-weight="bold"
     font-family="'Segoe UI', sans-serif"
     id="text8">To
        existing eBUS network
    </text>
  <!-- ========================================== -->
  <!--             COMPONENTS & DEVICES           -->
  <!-- ========================================== -->
  <!-- 1. USB-C Power Adapter -->
  <!-- 2. eBUS Stick (eAS) -->
  <g
     id="eBus-Stick"
     transform="translate(195, 450)">
    <!-- USB-C Port Left -->
    <rect
       x="-5"
       y="40"
       width="10"
       height="20"
       rx="2"
       fill="#4b5563"
       id="rect11" />
    <!-- Main Stick Body -->
    <rect
       x="0"
       y="0"
       width="160"
       height="100"
       rx="12"
       fill="#ffffff"
       filter="url(#shadow)"
       stroke="#f3f4f6"
       stroke-width="2"
       id="rect12" />
    <!-- Centered eAS Engraving -->
    <circle
       cx="80"
       cy="50"
       r="30"
       fill="#f8fafc"
       stroke="#e2e8f0"
       stroke-width="2"
       id="circle12" />
    <text
       x="80"
       y="58"
       font-size="24"
       fill="#cbd5e1"
       font-weight="bold"
       text-anchor="middle"
       id="text12">eAS</text>
    <!-- Black Pin Headers -->
    <rect
       x="25"
       y="20"
       width="12"
       height="60"
       fill="#111827"
       rx="1"
       id="rect13" />
    <rect
       x="125"
       y="20"
       width="12"
       height="60"
       fill="#111827"
       rx="1"
       id="rect14" />
    <!-- Status Dots -->
    <circle
       cx="31"
       cy="90"
       r="2"
       fill="#475569"
       id="circle14" />
    <circle
       cx="131"
       cy="90"
       r="2"
       fill="#475569"
       id="circle15" />
    <!-- Green Terminal Block (Left part in body, Right part protruding) -->
    <rect
       x="155"
       y="30"
       width="20"
       height="40"
       fill="#2d6a4f"
       id="rect15" />
    <rect
       x="175"
       y="35"
       width="25"
       height="30"
       fill="#40916c"
       rx="2"
       id="rect16" />
    <!-- Terminals/Screws -->
    <circle
       cx="188"
       cy="42"
       r="4"
       fill="#e2e8f0"
       stroke="#94a3b8"
       id="circle16" />
    <circle
       cx="188"
       cy="58"
       r="4"
       fill="#e2e8f0"
       stroke="#94a3b8"
       id="circle17" />
  </g>
  <!-- 3. Vaillant Gateway -->
  <g
     id="Gateway"
     transform="translate(520, 120)">
    <!-- Main Gateway Box -->
    <rect
       x="0"
       y="0"
       width="360"
       height="250"
       rx="15"
       fill="#ffffff"
       filter="url(#heavy-shadow)"
       stroke="#e2e8f0"
       id="rect17" />
    <!-- Stylized Vaillant Logo Block -->
    <g
       transform="translate(180, 80)"
       id="g18">
      <!-- Abstract Rabbit / V lines -->
      <text
         x="-43.594982"
         y="6.8508644"
         font-size="28px"
         font-weight="bold"
         fill="#1e293b"
         letter-spacing="-0.5"
         id="text18">Vaillant</text>
    </g>
    <text
       x="180"
       y="220"
       font-size="16"
       fill="#64748b"
       text-anchor="middle"
       letter-spacing="1"
       id="text19">myVAILLANT connect
        </text>
    <!-- Base / Port Bay at the bottom -->
    <path
       d="M 60 250 L 300 250 L 290 280 L 70 280 Z"
       fill="#f1f5f9"
       filter="url(#shadow)"
       id="path19" />
    <!-- Ports -->
    <!-- eBus Port (Green) -->
    <rect
       x="90"
       y="250"
       width="30"
       height="30"
       fill="#40916c"
       stroke="#2d6a4f"
       stroke-width="2"
       rx="2"
       id="rect19" />
    <circle
       cx="100"
       cy="265"
       r="3"
       fill="#1b4332"
       id="circle19" />
    <circle
       cx="110"
       cy="265"
       r="3"
       fill="#1b4332"
       id="circle20" />
    <text
       x="127.63737"
       y="298.38306"
       font-size="12px"
       fill="#40916c"
       text-anchor="middle"
       font-weight="bold"
       id="text20">eBUS</text>
    <text
       x="-11.493546"
       y="362.90247"
       font-size="12px"
       fill="#40916c"
       text-anchor="middle"
       font-weight="bold"
       id="text20-5"
       style="font-family:'Segoe UI', Roboto, Helvetica, sans-serif">Split both wires</text>
    <!-- Power Port (Black Barrel) -->
    <rect
       x="165"
       y="250"
       width="30"
       height="25"
       fill="#1f2937"
       rx="2"
       id="rect20" />
    <circle
       cx="180"
       cy="262"
       r="6"
       fill="#9ca3af"
       id="circle21" />
    <circle
       cx="180"
       cy="262"
       r="3"
       fill="#000000"
       id="circle22" />
    <text
       x="203.44585"
       y="297.57455"
       font-size="12px"
       fill="#475569"
       text-anchor="middle"
       font-weight="bold"
       id="text22">Power</text>
    <text
       x="-358.14014"
       y="367.97379"
       font-size="12px"
       fill="#475569"
       text-anchor="middle"
       font-weight="bold"
       id="text22-5"
       style="font-family:'Segoe UI', Roboto, Helvetica, sans-serif">Power</text>
    <!-- Ethernet Port (RJ45) -->
    <rect
       x="240"
       y="250"
       width="40"
       height="30"
       fill="#1e293b"
       rx="2"
       id="rect22" />
    <path
       d="M 245 275 L 245 260 L 275 260 L 275 275 L 265 275 L 265 280 L 255 280 L 255 275 Z"
       fill="#000"
       id="path22" />
    <text
       x="289.10519"
       y="298.38306"
       font-size="12px"
       fill="#3b82f6"
       text-anchor="middle"
       font-weight="bold"
       id="text23">Ethernet</text>
  </g>
  <!-- 4. Gateway Power Supply -->
  <!-- 5. Network Switch / Router -->
  <!-- ========================================== -->
  <!--               LABELS & ARROWS              -->
  <!-- ========================================== -->
  <g
     font-size="12"
     fill="#ef4444"
     font-weight="bold"
     font-family="monospace"
     id="g33">
    <!-- eBus Protocol Label -->
    <!-- USB-C Power Label -->
  </g>
</svg>
